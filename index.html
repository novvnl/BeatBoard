<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

<div class="logo-area">
    <img src="logo.png" alt="Logo">

        <h1>BeatBoard</h1>
</div>

        <nav>
            <a href="#">Início</a>
            <a href="#">Relatórios</a>
            <a href="#">Configurações</a>
        </nav>

    </header>


    <main class="main">

        <aside class="sidebar">

            <h3>Menu lateral</h3>

            <a href="#">Visão Geral</a>
            <a href="#">Usuários</a>
            <a href="#">Financeiro</a>
            <a href="#">Ajustes</a>

        </aside>


        <section class="content">

            <h2>Resumo</h2>

            <div class="cards">

                <div class="card">

                    <div>
                        <h3>Vendas</h3>
                        <p>Total de vendas</p>
                    </div>

                    <button>Detalhes</button>

                </div>


                <div class="card">

                    <div>
                        <h3>Novos Clientes</h3>
                        <p>Você tem +99 novos clientes</p>
                    </div>

                    <button>Detalhes</button>

                </div>


                <div class="card">

                    <div>
                        <h3>Suporte</h3>
                        <p>53 pedidos de suporte aguardando resposta.</p>
                    </div>

                    <button>Detalhes</button>

                </div>

            </div>

        </section>

    </main>


    <footer class="footer">
        <p>© 2026 - Atividade prática de Flexbox</p>
    </footer>

</body>

</html>
